# Development scrape configuration.
#
# Production reuses the existing Prometheus (ARCHITECTURE-v1 section 9); this
# file exists so the dashboards and alert rules shipped alongside it can be
# validated against a running platform before they are handed over.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development
    platform: chiotron-ai

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          plane: control

  # The GPU lives on the compute plane, and only a process with the NVIDIA
  # runtime can see it. The target is absent unless the compute profile is up,
  # which Prometheus reports as a down target rather than an error.
  - job_name: compute-gpu
    metrics_path: /metrics
    static_configs:
      - targets: ["gpu-exporter:9401"]
        labels:
          plane: compute

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
