apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-compute-plane
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-compute-plane
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-compute-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-compute-plane
    spec:
      containers:
        - name: ollama-worker
          image: ollama/ollama:latest
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.ollama
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ai-model-cache-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ai-compute-plane
  namespace: ai-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  selector:
    app.kubernetes.io/name: ai-compute-plane
