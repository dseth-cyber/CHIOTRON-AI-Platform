apiVersion: v1
kind: Service
metadata:
  name: ai-control-plane
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-control-plane
    app.kubernetes.io/part-of: ai-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ai-control-plane
