name: chiotron-ai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chiotron_ai}
      POSTGRES_USER: ${POSTGRES_USER:-chiotron_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  api:
    build:
      context: ./control-plane
      args:
        VERSION: ${VERSION:-dev}
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL:-postgres://chiotron_ai:change-me-before-production@postgres:5432/chiotron_ai?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # Seals provider API keys at rest. It stays an environment variable on
      # purpose: a key stored in the database it protects would protect nothing.
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      # The three below seed the provider registry on first start only. After
      # that the database owns routing and these are ignored, because two places
      # to change one thing is one too many.
      COMPUTE_PROVIDER: ${COMPUTE_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MODEL_ROUTES: ${MODEL_ROUTES:-reasoning=ollama/qwen3:8b,rag=ollama/qwen3:4b,fast=ollama/qwen3:0.6b}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-reasoning}
      COMPUTE_TIMEOUT: ${COMPUTE_TIMEOUT:-300s}
      COMPUTE_HEALTH_TIMEOUT: ${COMPUTE_HEALTH_TIMEOUT:-5s}
      DEFAULT_RATE_LIMIT_PER_MINUTE: ${DEFAULT_RATE_LIMIT_PER_MINUTE:-60}
      # Conversation retention and prompt logging are policy settings.
      PERSIST_PROMPTS: ${PERSIST_PROMPTS:-true}
      HISTORY_TURN_LIMIT: ${HISTORY_TURN_LIMIT:-20}
      # Knowledge platform. StorageProvider is the local adapter in development;
      # the production provider of record is still an open decision.
      STORAGE_ROOT: ${STORAGE_ROOT:-/var/lib/chiotron/documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CLASSIFICATION_LEVELS: ${CLASSIFICATION_LEVELS:-public,internal,confidential,restricted}
      CHUNK_SIZE: ${CHUNK_SIZE:-1200}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-5242880}
      INGESTION_INTERVAL: ${INGESTION_INTERVAL:-5s}
      INGESTION_BATCH: ${INGESTION_BATCH:-4}
      # Agent planner policy. Retrieval depth and the score a round must beat are
      # tuning, not business logic.
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-3}
      AGENT_TOP_K: ${AGENT_TOP_K:-5}
      AGENT_MIN_SCORE: ${AGENT_MIN_SCORE:-0.016}
      AGENT_CONFLICT_MARGIN: ${AGENT_CONFLICT_MARGIN:-0.15}
      # Graph traversal bounds. Depth alone is not enough: without a node cap a
      # two-hop walk from a well-connected entity can still reach everything.
      GRAPH_DEPTH: ${GRAPH_DEPTH:-2}
      GRAPH_MAX_NODES: ${GRAPH_MAX_NODES:-60}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STARTUP_TIMEOUT: ${STARTUP_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      # Metrics are always served on /metrics. Traces are exported only when a
      # collector endpoint is set, so local development runs without one.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-control-plane}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
    volumes:
      # Documents outlive the container, and the platform never keeps the only
      # copy of one inside the database. A fresh volume inherits the image
      # directory's nonroot ownership, which is why control-plane/Dockerfile
      # creates it: a volume created empty would be owned by root and the
      # nonroot process could not write to it.
      - document-data:/var/lib/chiotron/documents
    # The distroless image ships no shell, so readiness is verified from the
    # host with `curl http://localhost:8080/readyz` rather than a compose
    # healthcheck. Production uses an HTTP probe against /readyz.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5173:8080"
    networks: [control, compute]

  # Development-only observability. Production reuses the existing Prometheus,
  # Grafana, Loki and Tempo (ARCHITECTURE-v1 section 9) and loads the same
  # dashboards and alert rules from infra/. This profile exists so those
  # artefacts can be validated against a running platform before handover.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [control]

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      # Development only. Production uses the existing Grafana and its identity.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me-before-production}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    networks: [control]

  # GPU metrics come from the compute plane, because only a process with the
  # NVIDIA runtime can see the card.
  gpu-exporter:
    build:
      context: ./control-plane
      dockerfile: Dockerfile.gpu-exporter
    profiles: ["compute"]
    environment:
      GPU_EXPORTER_ADDR: ${GPU_EXPORTER_ADDR:-:9401}
      GPU_EXPORTER_INTERVAL: ${GPU_EXPORTER_INTERVAL:-10s}
      # utility is what makes the runtime inject nvidia-smi into the container.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # On `control` as well, so Prometheus can scrape it without crossing into
    # the compute network.
    networks: [compute, control]

  # VM5 substitute for local development. In production it belongs on an isolated GPU VM.
  ollama:
    image: ollama/ollama:latest
    profiles: ["compute"]
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # `control` is development-only egress for initial model downloads.
    # No host port is published; production VM5 should use a controlled egress path.
    networks: [compute, control]

networks:
  control:
    # Docker Desktop on this development host has exhausted its automatic
    # address pools, so reuse this pre-existing local development network.
    external: true
    name: chiotron_default
  compute:
    external: true
    name: chiotron-ai_compute

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  document-data:
  prometheus-data:
  grafana-data:
