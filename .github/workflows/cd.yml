name: CD (Continuous Deployment)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      pull_models:
        description: 'Pull/Update AI Models on Deploy'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Container Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/control-plane
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build & Push Control Plane Image
        uses: docker/build-push-action@v5
        with:
          context: ./control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ssh:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    # Only executes if PROD_HOST secret is configured in repository settings
    if: "${{ secrets.PROD_HOST != '' }}"
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER || 'ubuntu' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.PROD_WORK_DIR || '/opt/chiotron-ai' }}"
            echo "🚀 Deploying CHIOTRON AI Platform to $APP_DIR..."
            
            # 1. Create or navigate to deployment directory
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # 2. Pull latest code if git repo exists, or clone
            if [ -d .git ]; then
              echo "📥 Pulling latest codebase..."
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # 3. Build & update containers
            echo "🐳 Rebuilding & restarting containers..."
            docker compose build api
            docker compose up -d
            
            # 4. Pull models if requested
            if [ "${{ inputs.pull_models }}" = "true" ]; then
              echo "🧠 Pulling required AI Models..."
              docker compose --profile compute up -d ollama || true
              docker compose exec -T ollama ollama pull qwen2.5:0.5b || true
              docker compose exec -T ollama ollama pull nomic-embed-text || true
            fi
            
            # 5. Verify Health Check
            echo "🩺 Verifying Control Plane Health..."
            sleep 5
            curl -f http://localhost:8080/healthz || exit 1
            echo "✅ Deployment Successful and Healthy!"
